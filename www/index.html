<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <script>
        // Immersive è l'unica skin dell'app (Moderna e Walkman sono state rimosse): la
        // classe va applicata SUBITO (prima di qualsiasi CSS/paint), non solo quando
        // l'utente l'aveva scelta in passato, altrimenti il primo frame verrebbe
        // disegnato con lo sfondo di base invece di quello dinamico di Immersive.
        document.documentElement.classList.add('immersive');
    </script>
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SBIXIFY - Player</title>

    <!-- Stile critico: definito PRIMA di script/link esterni (Tailwind CDN, Font Awesome)
         apposta. Quelle risorse bloccano il parsing della pagina finché non vengono
         scaricate dalla rete, e se lo sfondo scuro fosse dichiarato dopo di loro, durante
         quell'attesa il browser mostrerebbe il grigio di default invece del nero dell'app
         (il flash grigio segnalato all'apertura/back). Messo qui, viene applicato subito. -->
    <style>
        /* ============================================================
           TOKEN SYSTEM (unica estetica dell'app, niente più palette multiple)
           ink        #000000  — base
           ink-2      #18151C  — superfici leggermente elevate (card/glass)
           ink-3      #221E27  — input/superfici ancora più elevate
           paper      #F3EFE6  — testo primario
           mute       #8B8794  — testo secondario
           signal     #FF9A21  — UNICO accento: arancione
           bg-grad    #1D164A → #000000 — gradiente viola/nero dello sfondo
           ============================================================ */
        :root {
            color-scheme: dark;
            /* Nero puro (non più #0D0E12): quel grigio scuro creava una "cucitura"
               visibile rispetto alle barre nere pure di stato/navigazione del sistema,
               che restano #000000 a prescindere dal theme-color della pagina. */
            --bg-main: #000000;
            --bg-gradient-top: #1D164A;
            --bg-gradient: linear-gradient(180deg, var(--bg-main) 0%, var(--bg-gradient-top) 35%, var(--bg-gradient-top) 55%, var(--bg-main) 100%);
            --bg-card: rgba(24, 21, 28, 0.72);
            --bg-input: #221E27;
            --accent: #FF9A21;
            --text-main: #F3EFE6;
            --text-muted: #8B8794;
            /* Skin "Immersive": colore dominante scuro estratto dall'artwork in
               riproduzione (calcolato via canvas in JS, vedi updateImmersiveColorFromArtwork)
               e url di sfondo del mini player, entrambi con un fallback statico finché
               nessun brano è ancora stato caricato. */
            --immersive-color: #0B0B0E;
            --immersive-color-15: rgba(11,11,14,0.15);
            --immersive-color-35: rgba(11,11,14,0.35);
            --immersive-color-55: rgba(11,11,14,0.55);
            --immersive-color-75: rgba(11,11,14,0.75);
            --immersive-color-90: rgba(11,11,14,0.9);
            /* Variante "vivida" dello stesso colore dominante (non quasi-nera come sopra):
               usata per evidenziare la riga del brano in ascolto nella lista canzoni
               (vedi .track-row.playing più sotto, non più anche in home) e per il tile
               della scheda "Immersive" selezionata in Impostazioni, calcolata in
               updateImmersiveColorFromArtwork insieme al testo di contrasto giusto. */
            --immersive-accent: #46464F;
            --immersive-accent-text: #ffffff;
            /* Fallback per le due varianti aggiunte per le copertine grigie/nere: cornice a
               contrasto (mini player + riga in ascolto) e sfondo/testo della schermata
               lyrics, entrambe calcolate insieme alle altre in
               updateImmersiveColorFromArtwork (vedi lì il perché non riusano semplicemente
               --immersive-color/--immersive-accent). */
            --immersive-frame-contrast: #0B0B0E;
            --immersive-lyrics-bg: #46464F;
            --immersive-lyrics-text: #ffffff;
            --immersive-lyrics-muted: #9A98A0;
            /* Sfondo chiaro (quasi bianco, appena tinto dal colore dominante del brano) e
               colore scuro in tinta per icona/testo della barra di ricerca in home - vedi
               updateImmersiveColorFromArtwork. Niente color-mix() (vedi nota già presente
               sul gradiente: non supportato da alcune WebView Android), qui il mix è già
               fatto in JS con numeri semplici. */
            --immersive-search-bg: #F3EFE6;
        }

        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg-main);
            color: var(--text-main);
        }

        /* Fallback locale per .hidden: Tailwind è caricato da CDN esterno e la sua
           utility .hidden{display:none} arriva solo dopo che lo script si scarica ed
           esegue. Nel frattempo elementi come il pulsante "aggiorna app" (nascosto di
           default via class="hidden") restavano visibili, dando l'impressione che
           comparisse sempre. Definendola già qui, subito, non dipende più dai tempi
           del CDN. */
        .hidden { display: none !important; }
    </style>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="192x192.png" type="image/png">
    <link rel="apple-touch-icon" href="192x192.png">
    
    <!-- Meta Theme Color multipli per Firefox ed Android: #0B0B0E è il colore d'attesa di
         Immersive (unica skin dell'app) finché non riparte l'ultimo brano e non viene
         ricalcolato quello dinamico dalla sua artwork (vedi updateImmersiveColorFromArtwork). -->
    <meta name="theme-color" content="#0B0B0E" id="metaThemeColor">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0E" id="metaThemeColorDark">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-menu-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SBIXIFY">

    <!-- SbixiLocal è offline: niente più Google Fonts/Fontshare/CDN. Tailwind, Font
         Awesome e Inter sono vendorizzati localmente in vendor/. General Sans
         (Fontshare) non ha un pacchetto offline equivalente pronto: la tipografia
         Immersive ripiega sullo stack di sistema (vedi font-family più sotto) finché
         non forniamo eventuali file .woff2 della licenza già acquisita. -->
    <link rel="stylesheet" href="vendor/inter/inter.css">
    <script src="vendor/tailwind-browser.js"></script>
    <script src="folder-access.js"></script>
    <link rel="stylesheet" href="vendor/fontawesome/all.min.css">

    <style>
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            tap-highlight-color: rgba(0,0,0,0) !important;
        }
        button, a, [role="button"], i {
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none !important;
            touch-action: manipulation;
        }
        #playPauseBtn, #miniPlayPauseBtn {
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            outline: none !important;
            box-shadow: none;
        }
        #playPauseBtn:focus, #playPauseBtn:active,
        #miniPlayPauseBtn:focus, #miniPlayPauseBtn:active {
            outline: none !important;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5) !important;
        }
        ::-webkit-scrollbar {
            display: none;
            width: 0px;
            background: transparent;
        }

        body { font-family: 'Inter', sans-serif; }
        .display { font-family: 'Inter', sans-serif; }

        /* --- SLIDER TRA VISTA PLAYLIST E VISTA LISTA CANZONI --- */
        #viewsSlider {
            width: 200%;
            transform: translateX(0%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        #viewsSlider.showing-results {
            transform: translateX(-50%);
        }
        #homeView, #resultsView {
            width: 50%;
        }
        /* La maschera sfumata in cima non serve più: l'header risultati ora è dentro
           #resultsView (sticky, con sfondo opaco) invece che esterno/assoluto sopra la lista. */
        /* --- FADE-IN A CASCATA DEI BRANI (dall'alto verso il basso) --- */
        @keyframes trackRowIn {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .track-row-enter {
            animation: trackRowIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        /* La pressione prolungata su una riga apre "Correggi canzone" (vedi renderTracklist):
           senza queste regole, tenere premuto sul titolo/artista (testo normale, non protetto
           dalla regola globale valida solo per button/a/[role=button]/i) fa scattare la
           selezione nativa del testo del browser, che copre l'interfaccia e impedisce di
           vedere/usare quello che il tap prolungato doveva aprire. */
        .track-row, .track-row * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Mini Player: Vetro satinato dinamico perfettamente integrato con l'estetica dell'app */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* (Placeholder dell'artwork rimosso su richiesta: ora, prima del caricamento,
           non c'è alcun elemento visibile al posto della copertina.) */

        #nowPlayingSheet {
            position: fixed;
            top: 100%;
            left: 0;
            right: 0;
            height: 100%;
            z-index: 100;
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            transform: translateZ(0); /* layer di compositing esplicito e stabile, sempre sopra */
            background: var(--bg-gradient);
            overflow: hidden;
            overscroll-behavior: none;
        }
        #nowPlayingSheet.expanded {
            transform: translateY(-100%) translateZ(0);
        }
        /* NOTA sul compositing (revisione 3): niente più trucchi per "nascondere"
           header/carosello via visibility durante lo swipe - la sheet ora si comporta
           semplicemente come un layer che si sovrappone, lasciando la home intatta
           sotto di sé (esattamente come un normale z-index). Il vecchio bug per cui su
           alcune WebView Android/Chromium (Brave incluso) .home-header/.results-header
           (essendo "position: sticky" dentro un contenitore con overflow-y:auto)
           potevano comparire "sopra" #nowPlayingSheet nonostante il suo z-index più alto
           era un bug di compositing del motore (promozione a layer del contenuto sticky
           che ignorava la stacking context reale): risolto alla radice forzando questi
           elementi in un proprio layer esplicito e stabile con "transform: translateZ(0)"
           (vedi .home-header, .results-header, #recentGrid, .quick-eyebrow qui sotto),
           invece di continuare a nasconderli quando la sheet li copre. */

        /* Striscia "riserva gesto di sistema": in display:fullscreen la nav bar di
           Android è nascosta e per farla ricomparire serve uno swipe dal bordo
           inferiore - lo STESSO gesto usato per scrollare le liste, che partendo
           proprio da lì veniva catturato anche dal contenuto sottostante (doppio
           effetto: scroll + reveal). Questa striscia invisibile e non scrollabile,
           sempre sopra a tutto, intercetta il touchstart prima che raggiunga la
           lista: con touch-action:none il browser non avvia mai uno scroll da un
           tocco iniziato qui, lasciando il gesto libero per il sistema. Non copre
           il mini player (che sta più in alto, staccato dal bordo). */
        #gestureEdgeGuard {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: max(24px, env(safe-area-inset-bottom, 0px));
            touch-action: none;
            z-index: 20;
        }
        /* Il pulsante "freccia giù" per chiudere la Now Playing sheet è stato rimosso in
           TUTTE le skin (Immersive lo nascondeva già, ora anche Moderna/Walkman): la
           chiusura resta comunque disponibile via swipe verso il basso su
           #sheetHeaderDrag/#sheetSwipeCloseArea, sempre presente. Tolto perché si
           sovrapponeva visivamente al nuovo #lyricsOffsetBtn qui sotto quando i testi
           sono aperti. NOTA: "visibility: hidden", non "display: none" - quest'ultimo lo
           toglieva anche dal flusso del flex #sheetHeaderRow, lasciando il blocco
           centrale ("RIPRODUZIONE DA PLAYLIST"/nome playlist) sbilanciato verso sinistra
           dato che a destra restava comunque il pulsante download a fargli da contrappeso.
           Con visibility, lo spazio (invisibile, non cliccabile) resta a bilanciare. */
        #closeSheetBtn { visibility: hidden !important; }
        /* Vedi commento sul markup più sopra: posizionato assoluto rispetto a
           #nowPlayingSheet (che è "position: fixed", quindi già containing block valido)
           invece che dentro il flex #sheetHeaderRow, per restare in alto a sinistra
           identico a prescindere da come ogni skin riorganizza l'header. Nascosto di
           default, mostrato solo con .lyrics-open (vedi openLyricsPanel/closeLyricsPanel).
           Colore: stessa classe "custom-text-accent" del pulsante download (var(--accent)),
           coerente in Moderna/Walkman - Immersive lo sovrascrive esplicitamente più sotto
           con bianco fisso, come il resto dei testi/controlli di quella skin. */
        /* Wrapper generico "icona in scatola 1em×1em, centrata via absolute+transform":
           usato sia da #lyricsOffsetBtn (una sola icona) sia da #driveModeBtn (due icone
           impilate per il morph) così i contenuti di entrambi i pulsanti hanno ESATTAMENTE
           la stessa geometria (nessuna variazione dovuta ai metrics naturali, leggermente
           diversi, dei singoli glifi Font Awesome) e restano perfettamente allineati alla
           stessa altezza, uno a sinistra e uno a destra. */
        .icon-stack {
            position: relative;
            width: 1em;
            height: 1em;
            display: inline-flex;
        }
        .icon-stack i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #lyricsOffsetBtn {
            display: none;
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 30px);
            left: 24px;
            z-index: 30;
            padding: 8px;
            font-size: 15px;
            pointer-events: auto;
        }
        #lyricsOffsetBtn:active { opacity: 0.7; }
        #nowPlayingSheet.lyrics-open #lyricsOffsetBtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        html.immersive #lyricsOffsetBtn { color: #fff !important; }

        #miniPlayer {
            transform: translateY(150%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        #miniPlayer.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        #miniTextContainer {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease-out;
            will-change: transform, opacity;
        }
        #miniTextContainer.dragging-active {
            transition: none;
        }

        /* Durante il trascinamento del dito sulla barra del minutaggio (grande o mini) la
           larghezza va aggiornata ISTANTANEAMENTE: la transition-all/duration-100 che le due
           barre hanno di default (per l'avanzamento "morbido" durante la riproduzione normale)
           altrimenti anima ogni singolo aggiornamento inseguendo il dito con un ritardo fisso,
           risultando a scatti quando si trascina velocemente. */
        #progressBar.scrubbing,
        #miniProgressBar.scrubbing {
            transition: none !important;
        }

        /* NOTA: qui prima esisteva un intero blocco CSS ("STRUTTURA DINAMICA BARRA DI
           RICERCA") ereditato dalla vecchia barra di ricerca a comparsa, con classe
           .search-container. Con il nuovo header stile mockup la barra è invece
           .search-pill (sempre visibile, niente animazione di comparsa) e quella
           classe non esiste più nel markup: la regola `.search-container.active
           #searchInput { pointer-events: auto; }` non scattava MAI, quindi
           #searchInput restava con `pointer-events: none` per sempre (impostato da
           quella stessa vecchia regola) e la tastiera non si apriva mai al tap.
           Blocco rimosso: lo stile reale della barra è più sotto, sotto
           ".search-pill". */

        .marquee-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .marquee-wrapper.fade-edges {
            mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }
        .animate-marquee {
            animation: marqueeLoop 12s linear infinite;
        }
        @keyframes marqueeLoop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        /* Sfumatura ai bordi per i testi troncati "generici" (vedi MARQUEE_TARGET_SELECTOR
           più sotto in JS): stessa maschera di .marquee-wrapper.fade-edges, ma applicata
           direttamente sull'elemento di testo originale invece che su un wrapper dedicato,
           così non serve toccare il markup di ogni pagina per usarla. */
        .marquee-fade {
            mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
        }

        /* Pulsante Play/Pausa: icona semplice (Font Awesome), nessun hover-scale sul bottone
           (dimensione fissa identica su Windows e Android). Solo un piccolo "pop" quando lo
           stato cambia davvero, per dare un minimo di feedback. */
        @keyframes iconPop {
            0%   { transform: scale(0.55); }
            100% { transform: scale(1); }
        }
        .icon-pop {
            display: inline-block;
            animation: iconPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
            /* Evita che il testo "alt" venga mostrato per una frazione di secondo
               mentre l'immagine è ancora in caricamento (es. su connessioni lente) */
            color: transparent;
            font-size: 0;
        }
        .track-thumb-img {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        /* Le immagini <img> hanno su Android/Chrome un proprio menu contestuale
           nativo (apri/salva immagine) che scatta con una sua vibrazione intorno
           ai 500ms, PRIMA e in aggiunta alla pressione prolungata di 4s gestita da
           noi su .track-row (vedi renderTracklist) - risultando in una doppia
           vibrazione. pointer-events:none toglie l'immagine dal riconoscimento nativo
           dei gesti touch: gli eventi passano al contenitore sottostante (.track-row),
           dove restano gestiti regolarmente dal nostro long press. */
        .track-thumb-img {
            pointer-events: none;
        }
        .track-thumb-img.loaded {
            opacity: 1;
        }

        /* --- ZOOM ARTWORK ---
           Molte copertine (soprattutto quelle prese da iTunes per i brani importati
           da Spotify) hanno i bordi/angoli neri "cuciti" dentro l'immagine stessa
           (fanno parte del quadrato originale): richiedere una risoluzione più alta
           non li elimina, perché è sempre lo stesso identico ritaglio quadrato.
           Applichiamo quindi uno zoom leggero su TUTTE le artwork (l'immagine viene
           ingrandita e i bordi finiscono fuori dal cerchio/contenitore, che ha
           overflow:hidden), così i bordi neri spariscono anche sulle copertine che
           li hanno. Valore regolabile da qui: più alto = più zoom/crop. */
        :root { --artwork-zoom: 1.37; --miniplayer-artwork-zoom: 1; }
        #sheetArtworkImg,
        .track-thumb-img {
            transform: scale(var(--artwork-zoom));
            transform-origin: center;
        }
        /* L'artwork del mini player va mostrata per intero dentro la sua cornice
           circolare, senza lo zoom-crop usato altrove: qui usiamo un fattore
           regolabile a parte (default 1 = nessuno zoom). */
        #miniPlayerImg {
            transform: scale(var(--miniplayer-artwork-zoom));
            transform-origin: center;
        }

        .custom-bg-main { background: var(--bg-gradient); }
        /* Il body stesso resta a tinta piena (bg-main): il padding p-4 del body, se
           avesse lo sfondo sfumato, lo rivelerebbe come due "colonne" viola ai lati
           (e strisce sopra/sotto), visibili a tutta altezza perché nessun contenuto
           interno arriva fino al bordo reale dello schermo per coprirle. La sfumatura
           viola vive invece su .app-gradient-bg (il <main>), che coincide esattamente
           con l'area interna al padding: così il gutter del body appare nero pieno,
           uguale allo sfondo degli header (--bg-main), senza cuciture visibili. */
        .app-body-bg { background: var(--bg-main); }
        .app-gradient-bg { background: var(--bg-gradient); }
        .custom-bg-card { background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .custom-bg-input { background-color: var(--bg-input); }
        .custom-text-accent { color: var(--accent); }
        .custom-bg-accent { background-color: var(--accent); }
        .custom-border-accent { border-color: var(--accent); }
        .custom-text-muted { color: var(--text-muted); }

        /* Pulsante repeat nella Now Playing sheet: dimensione fissa e tonda così, da spento,
           ha la stessa "ingombro" del suo gemello invisibile a destra (mantiene la simmetria
           attorno a play/pause). Dimensioni +30% rispetto all'originale (25px -> 32.5px). */
        #repeatBtn, #repeatRightPlaceholder {
            width: 32.5px;
            height: 32.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }
        /* Da acceso vogliamo una singola icona con un outline netto (non un alone/glow)
           che segua esattamente il contorno del simbolo, colorato con il colore di sfondo
           del tema (--bg-gradient-top), così l'icona sembra "ritagliata" sullo sfondo
           invece di avere un bagliore sfocato. Usiamo -webkit-text-stroke: è un bordo
           piatto disegnato lungo il contorno del glifo, non uno shadow/blur. */
        #repeatBtn { position: relative; }
        #repeatIcon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #repeatBtn.active #repeatIcon {
            color: var(--accent);
            -webkit-text-stroke: 3.25px var(--bg-gradient-top);
            paint-order: stroke fill;
        }

        /* Sleep timer: stesse identiche caratteristiche del pulsante repeat qui sopra
           (ingombro, outline "ritagliato" da attivo), icona sveglia invece che repeat.
           Dimensioni +30% rispetto all'originale (25px -> 32.5px), in coppia con repeatBtn. */
        #sleepTimerBtn {
            width: 32.5px;
            height: 32.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            position: relative;
        }
        #sleepTimerIcon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #sleepTimerBtn.active #sleepTimerIcon {
            color: var(--accent);
            -webkit-text-stroke: 3.25px var(--bg-gradient-top);
            paint-order: stroke fill;
        }
        /* Sleep timer: bottom sheet a piena larghezza (stile Spotify), overlay + sheet che
           sale dal basso. Sfondo completamente opaco con --bg-main (a differenza di
           .settings-sheet/.glass-panel qui sopra, che sono semitrasparenti/sfocati) così
           segue il colore pieno di ogni skin invece di lasciar trasparire quello sotto. */
        /* Nota: qui NON usiamo "opacity" sul contenitore, perché opacity si applica anche
           ai figli (quindi anche alla .sleep-timer-sheet, che pure ha uno sfondo pieno)
           facendo apparire la sheet trasparente per tutta la durata del fade-in, opaca
           solo a fine animazione. Animando invece "background-color" (solo il velo scuro
           dietro), la sheet resta sempre completamente opaca fin da subito, dato che è
           comunque nascosta fuori schermo da translateY(100%) quando non è .active. */
        .sleep-timer-modal {
            position: fixed;
            inset: 0;
            z-index: 110;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
            visibility: hidden;
            pointer-events: none;
            transition: background-color 0.3s ease, visibility 0s linear 0.3s;
        }
        .sleep-timer-modal.active {
            background: rgba(0, 0, 0, 0.55);
            visibility: visible;
            pointer-events: auto;
            transition: background-color 0.3s ease, visibility 0s linear 0s;
        }
        .sleep-timer-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--bg-main);
            border-radius: 22px 22px 0 0;
            padding: 12px 22px calc(22px + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sleep-timer-modal.active .sleep-timer-sheet {
            transform: translateY(0);
        }
        .sleep-timer-sheet-handle {
            width: 36px;
            height: 4px;
            border-radius: 999px;
            background: var(--text-muted);
            opacity: 0.5;
            margin: 0 auto 18px;
        }
        .sleep-timer-sheet-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 14px;
        }
        .sleep-timer-sheet-divider {
            height: 1px;
            background: var(--hair, rgba(243,239,230,0.1));
            margin: 0 -22px 4px;
        }
        .sleep-timer-option {
            padding: 15px 4px;
            font-size: 15px;
            color: var(--text-main);
            cursor: pointer;
        }
        .sleep-timer-option:active {
            background: rgba(255,255,255,0.06);

        /* Modal "Correggi canzone": stessa sheet (overlay, animazione, sfondo opaco) del
           timer spegnimento qui sopra (.sleep-timer-modal/.sleep-timer-sheet, riusate tali
           e quali), solo l'intestazione cambia: qui serve un pulsante indietro esplicito
           (il timer si chiude solo toccando fuori) che fa scendere e nasconde la sheet. Il
           titolo resta centrato con lo stesso trucco dello spacer invisibile già usato per
           #repeatBtn/#repeatRightPlaceholder e per l'header della Now Playing sheet. */
        .correct-song-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .correct-song-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .correct-song-back:active { opacity: 0.6; }
        .correct-song-title {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .correct-song-spacer { width: 32px; flex: 0 0 auto; }

        /* Senza queste due regole .sleep-timer-sheet non ha un'altezza massima: con 8
           risultati (thumbnail+titolo+canale ciascuno) il foglio cresce oltre lo schermo
           e, essendo ancorato in basso (align-items:flex-end sul modal), l'eccesso finisce
           SOPRA il bordo superiore, tagliando fuori header e primi risultati. Diamo al
           foglio un tetto massimo e rendiamo scorrevole solo la lista risultati: header e
           titolo restano sempre visibili in alto, tutti i risultati restano raggiungibili
           con lo scroll. */
        #correctSongModal .sleep-timer-sheet {
            max-height: 78vh;
            display: flex;
            flex-direction: column;
        }
        #correctSongResults {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            min-height: 0;
        }

        .correct-song-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 4px;

            border-radius: 14px;
            transition: background-color 0.15s ease;
