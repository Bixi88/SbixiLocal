        .correct-song-result:active { background: rgba(255,255,255,0.06); }
        .correct-song-result-thumb {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            flex: 0 0 auto;
            background-color: var(--bg-input);
        }
        .correct-song-result-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .correct-song-result-info { flex: 1; min-width: 0; }
        .correct-song-result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .correct-song-result-channel {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .correct-song-status {
            text-align: center;
            padding: 28px 8px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ---- Modal "Offset sincronizzazione testo" ----
           Stessa sheet (.sleep-timer-modal/.sleep-timer-sheet) di sleep timer/correggi
           canzone qui sopra, per restare automaticamente coerente con ogni skin (usa già
           var(--bg-main)/var(--text-main) ecc.) - qui solo il contenuto proprio: icona,
           titolo, valore, slider, tre azioni testuali. */
        .lyrics-offset-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin: 2px auto 18px;
        }
        .lyrics-offset-title {
            font-size: 23px;
            font-weight: 800;
            line-height: 1.22;
            color: var(--text-main);
            text-align: center;
            margin: 0 0 20px;
        }
        .lyrics-offset-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }
        .lyrics-offset-slider {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            outline: none;
            margin: 0 0 30px;
            /* Il background reale (i due toni prima/dopo il cursore) viene impostato via
               JS ad ogni cambio valore (updateLyricsOffsetUI) - qui solo un fallback
               prima che il primo aggiornamento giri. */
            background: var(--hair, rgba(243,239,230,0.18));
        }
        .lyrics-offset-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 7px;
            height: 32px;
            border-radius: 4px;
            background: var(--text-main);
            box-shadow: 0 0 0 4px var(--bg-main);
            cursor: pointer;
        }
        .lyrics-offset-slider::-moz-range-thumb {
            width: 7px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: var(--text-main);
            box-shadow: 0 0 0 4px var(--bg-main);
            cursor: pointer;
        }
        .lyrics-offset-slider::-moz-range-track {
            height: 10px;
            border-radius: 999px;
            background: transparent;
        }
        .lyrics-offset-actions {
            display: flex;
            gap: 10px;
            padding-bottom: 2px;
        }
        .lyrics-offset-action {
            flex: 1;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--immersive-accent-text);
            background: var(--immersive-accent);
            border: none;
            border-radius: 999px;
            padding: 10px 4px;
            cursor: pointer;
        }
        .lyrics-offset-action:active { opacity: 0.7; }

        #miniPlayer, #miniPlayer *, #swipeTitleContainer, #swipeTitleContainer * {
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* --- MENU IMPOSTAZIONI: overlay + sheet animati in stile Gemini --- */
        #apiModal {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        #apiModal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.3s ease, visibility 0s linear 0s;
        }
        #apiModal .settings-sheet {
            width: 100%;
            max-width: 480px;
            max-height: 50vh;
            overflow-y: auto;
            border-radius: 28px 28px 0 0;
            padding: 14px 24px calc(22px + env(safe-area-inset-bottom, 0px));
            /* Unica animazione del menu impostazioni: entra/esce orizzontalmente da
               sinistra verso destra e viceversa (niente più swipe/animazione verticale). */
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        #apiModal.active .settings-sheet {
            transform: translateX(0);
        }
        /* Menu impostazioni: usa .glass-panel come tutti gli altri overlay, quindi di
           base è semitrasparente/sfocato. Qui lo rendiamo pieno con lo stesso colore
           solido --bg-main già usato per il bottom sheet del timer. */
        #apiModal .settings-sheet {
            background: var(--bg-main);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        @media (min-width: 768px) {
            #apiModal {
                align-items: center;
                padding: 16px;
            }
            #apiModal .settings-sheet {
                border-radius: 26px;
                max-height: 60vh;
                padding: 24px;
                transform: translateX(-40px);
                opacity: 0;
                transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            }
            #apiModal.active .settings-sheet {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ================= SETTINGS: lista "Playlist Recenti" ================= */
        .settings-playlist-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 6px; border-radius: 14px; cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .settings-playlist-row:active { background: rgba(255,255,255,0.05); }
        .settings-playlist-thumb {
            width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
            background-color: var(--bg-input); background-size: calc(var(--artwork-zoom) * 100%); background-position: center;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 12px; overflow: hidden;
        }
        .settings-playlist-name {
            flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--text-main);
        }
        .settings-playlist-remove {
            flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 12px; background: rgba(255,255,255,0.05);
        }
        .settings-playlist-remove:active { color: var(--text-main); transform: scale(0.9); }

        /* ================= HEADER: home (menu + titolo + pillola ricerca) ================= */
        /* L'header è il primo figlio della vista home (dentro #homeView, che scrolla),
           reso "sticky" in cima: si comporta come un header fisso ma la sua altezza è
           sempre quella naturale del contenuto. Lo sfondo/dissolvenza dietro è generato
           da pseudo-elementi propri (vedi .home-header::before/::after qui sotto). */
        .home-header {
            position: sticky; top: 0; z-index: 25;
            padding: 4px 6px 0;
            /* Vedi nota sul compositing più sopra: layer esplicito e stabile, mai
               "squashato" insieme ai vicini, così #nowPlayingSheet (altro layer
               esplicito, più in alto) lo copre sempre in modo corretto e prevedibile. */
            transform: translateZ(0);
        }
        /* Sfondo/dissolvenza ora DENTRO l'header stesso (pseudo-elementi), non più un
           elemento a parte "position:fixed" fratello altrove nel DOM: quell'approccio,
           dentro contenitori con overflow-hidden/overflow-y-auto in cascata, su alcuni
           WebView Android (Brave/PWA) poteva clippare o disegnare nell'ordine sbagliato
           in modo incoerente, nascondendo menu/pillola invece di stare dietro. Un
           pseudo-elemento è invece SEMPRE figlio dell'header: eredita automaticamente
           la sua stessa "elevazione" (sticky + z-index) sopra i contenuti successivi
           che scorrono sotto, senza bisogno di controllare stacking-context distanti.
           ::before copre di nero pieno esattamente l'altezza naturale dell'header
           (100%, quindi arriva sempre fino al bordo inferiore della pillola, qualunque
           esso sia — niente più altezze in px "indovinate"). ::after riprende subito
           dopo (top:100%) e sfuma verso il trasparente, così le playlist che scorrono
           sotto svaniscono prima di toccare la pillola invece di intravedersi dietro. */
        .home-header::before {
            content: ''; position: absolute; z-index: -1;
            top: 0; left: 0; right: 0; height: 100%;
            background: var(--bg-main);
            pointer-events: none;
        }
        .home-header::after {
            content: ''; position: absolute; z-index: -1;
            top: 100%; left: 0; right: 0; height: 56px;
            background: linear-gradient(to bottom, var(--bg-main) 0%, transparent 100%);
            pointer-events: none;
        }
        .home-header-row { display:flex; align-items:center; justify-content:flex-start; gap:10px; height:40px; position:relative; }
        .menu-icon-btn { position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:transparent; flex:0 0 auto; }
        /* Le due barre restano nel DOM (il bottone resta cliccabile, stessa area di
           40x40) ma invisibili: l'utente vuole l'icona nascosta, non il pulsante. Il
           pallino rosso di errore (#apiErrorBadge, sibling) non è "l'icona" ma un avviso
           di stato reale, quindi resta visibile quando attivo. */
        .menu-bars { width:18px; height:13px; display:flex; flex-direction:column; justify-content:space-between; opacity:0; }
        .menu-bars span { display:block; height:2px; border-radius:2px; background:var(--text-main); width:100%; }
        .menu-bars span:last-child { width:65%; }
        .error-badge { position:absolute; top:6px; right:6px; width:9px; height:9px; border-radius:50%; background:#ff4d4d; border:1px solid var(--bg-main); }
        /* Titolo "SBIXIFY": centrato rispetto all'intera riga header (non al solo spazio
           libero tra i due pulsanti laterali) con position:absolute + translate, così
           resta centrato indipendentemente dal pulsante aggiornamento a destra (quasi
           sempre nascosto, quindi larghezza asimmetrica rispetto al pulsante impostazioni
           a sinistra se centrato "a occhio" col solo flexbox). pointer-events:none perché
           non deve intercettare i tap destinati ai due pulsanti sotto/accanto. */
        .app-title { font-size:23px; font-weight:700; letter-spacing:-0.01em; text-align:center; margin:0; position:absolute; left:50%; top:50%; transform:translate(-50%, calc(-50% + 4px)); white-space:nowrap; pointer-events:none; }
        .update-btn { position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); color:var(--text-main); flex:0 0 auto; margin-left:auto; }
        .update-dot { position:absolute; top:6px; right:6px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:1px solid var(--bg-main); }

        .search-pill { margin-top:12px; background:var(--immersive-search-bg); border-radius:999px; display:flex; align-items:center; gap:10px; padding:10px 14px; position:relative; }
        .search-pill .mag-btn { color:var(--immersive-color); font-size:15px; flex:0 0 auto; background:none; border:none; padding:2px; display:flex; -webkit-text-stroke: 0.5px currentColor; text-stroke: 0.5px currentColor; }
        #searchInput { flex:1; border:none !important; outline:none !important; background:transparent !important; font-family:'Inter',sans-serif; font-size:13.5px !important; font-weight:500; color:var(--immersive-color) !important; width:auto !important; opacity:1 !important; padding:0 !important; height:auto !important; -webkit-appearance:none; appearance:none; }
        #searchInput::-webkit-search-decoration,
        #searchInput::-webkit-search-cancel-button,
        #searchInput::-webkit-search-results-button,
        #searchInput::-webkit-search-results-decoration { display:none; -webkit-appearance:none; }
        #searchInput::placeholder { color:var(--immersive-color); opacity:0.55; }

        /* ================= SUGGERIMENTI LIVE (autocomplete via Deezer) =================
           Dropdown che compare mentre si digita nella barra di ricerca, prima ancora di
           premere Invio: mischia artisti e brani trovati su Deezer (endpoint pubblico,
           nessuna chiave, nessuna quota) per dare un riscontro immediato "a schermata
           intera" come su YouTube Music, SENZA però interrogare ad ogni tasto il Worker
           Cloudflare che risolve i video YouTube (quello resta usato una sola volta,
           solo quando l'utente conferma la ricerca o tocca un suggerimento). Ancorato al
           search-pill (già position:relative) invece che all'header, così segue la
           pillola indipendentemente da eventuali margini/padding dell'header. */
        .search-suggestions {
            /* Prima: var(--bg-card, var(--bg-input)), fisso e scuro anche in skin Immersive
               (dove --bg-card/--bg-input restano colori statici, vedi html.immersive più sotto).
               Ora var(--bg-main): in Immersive equivale a var(--immersive-color), lo stesso
               scuro dinamico calcolato dall'artwork che usano già home, lista canzoni e
               impostazioni - il dropdown resta dello stesso colore di sfondo di tutta l'app
               invece di essere un nero fisso a sé stante. */
            position:absolute; left:0; right:0; top:calc(100% + 8px);
            background:var(--bg-main); border-radius:20px;
            box-shadow:0 16px 34px -12px rgba(0,0,0,.6); overflow-y:auto; -webkit-overflow-scrolling:touch;
            max-height:56vh; z-index:60; padding:6px;
        }
        .search-suggestions.hidden { display:none; }
        .suggest-row { display:flex; align-items:center; gap:12px; padding:8px 8px; border-radius:14px; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        .suggest-row:active { background:rgba(255,255,255,0.07); }
        /* Tondo per entrambi i tipi (prima i brani avevano un quadrato 8px-radius, incoerente
           col resto dell'app dove ogni riga - track-row, artist-row - usa un cerchio): brani
           44px, come le miniature di TUTTE le righe canzone dell'app (track-row in
           renderTracklist, home); artisti un tondo più grande (52px, come .artist-row) per
           distinguerli a colpo d'occhio senza tornare al quadrato. */
        .suggest-row .suggest-thumb { width:44px; height:44px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center; background-color:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:13px; }
        .suggest-row.is-artist .suggest-thumb { width:52px; height:52px; }
        .suggest-row.is-album .suggest-thumb { width:52px; height:52px; border-radius:8px; }
        .suggest-row .suggest-meta { flex:1; min-width:0; }
        .suggest-row .suggest-title { font-size:13.5px; font-weight:700; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .suggest-row .suggest-sub { font-size:11.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .suggest-row .suggest-icon { width:14px; text-align:center; color:var(--text-muted); font-size:11px; flex-shrink:0; opacity:0.7; }
        .suggest-divider { margin:2px 8px 4px; padding-top:4px; font-size:10.5px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); }
        .suggest-loading, .suggest-empty { display:flex; align-items:center; justify-content:center; gap:8px; padding:26px 8px; color:var(--text-muted); font-size:12.5px; font-weight:600; }
        /* ================= HEADER: results (freccia indietro + titolo) ================= */
        /* Stesso discorso dell'header home: primo figlio di #resultsView, sticky in cima,
           sfondo/dissolvenza via pseudo-elementi propri (vedi ::before/::after sotto). */
        .results-header {
            position: sticky; top: 0; z-index: 25;
            display:flex; align-items:center; gap:14px;
            padding:10px 8px 6px; height:40px;
            transform: translateZ(0); /* vedi nota sul compositing sopra .home-header */
        }
        /* Stesso schema del .home-header qui sopra: sfondo pieno + dissolvenza tramite
           pseudo-elementi figli, sempre disegnati nell'ordine giusto rispetto alla
           lista canzoni che scorre sotto (vedi commento esteso sopra su .home-header). */
        .results-header::before {
            content: ''; position: absolute; z-index: -1;
            top: 0; left: 0; right: 0; height: 100%;
            background: var(--bg-main);
            pointer-events: none;
        }
        .results-header::after {
            content: ''; position: absolute; z-index: -1;
            top: 100%; left: 0; right: 0; height: 56px;
            background: linear-gradient(to bottom, var(--bg-main) 0%, transparent 100%);
            pointer-events: none;
        }

        /* (Il vecchio layer di sfondo "position:fixed" bordo-a-bordo dietro gli header è
           stato rimosso: sostituito dai pseudo-elementi ::before/::after direttamente su
           .home-header/.results-header qui sopra, per evitare i problemi di clipping/
           stacking tra contenitori con overflow diversi. I due elementi vuoti che
           c'erano prima nell'HTML sono stati rimossi, non servono più. */
        .results-header .back-btn { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); flex:0 0 auto; }
        .results-header .rt { font-size:16px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; color: var(--accent); }
        .results-header .refresh-btn { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); flex:0 0 auto; font-size:13px; opacity:.85; }
        .results-header .refresh-btn:active { transform:scale(0.9); }

        /* ================= HOME: griglia "Playlist" (fissa, 3 colonne) + colonna "Canzoni" ================= */
        /* Stessa dimensione/peso/uppercase del titolo playlist nell'header risultati
           (.results-header .rt) così le due schermate restano coerenti fra loro. */
        .quick-eyebrow { padding:22px 24px 4px; font-size:16px; letter-spacing:.02em; text-transform:uppercase; color:var(--text-muted); font-weight:700; transform: translateZ(0); }
        /* La prima label ("Playlist", subito dopo l'header) cade dentro la sfumatura di
           56px di .home-header::after qui sopra e risultava un po' sfocata/lavata appena
           aperta la home. Un po' più di spazio sopra SOLO per lei (non per "Canzoni" più
           sotto, fuori da quella zona) la porta oltre la sfumatura; essendo padding e non
           margin negativo altrove, spinge naturalmente in basso anche tutto quello che
           segue nel flusso (griglia playlist, canzoni), niente altro da ritoccare. */
        .home-header + .quick-eyebrow { padding-top: 34px; }
        .quick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 9px; padding:14px 9px 20px; justify-items:center; transform: translateZ(0); }
        .qcard { display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; width:100%; min-width:0; }
        .qcard * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        .qcard:active { transform:scale(0.96); }
        .qcard { position:relative; }
        .qcard .circle { width:100%; aspect-ratio:1/1; border-radius:50%; background-size:calc(var(--artwork-zoom) * 100%); background-position:center; background-color:var(--bg-input); position:relative; box-shadow:0 10px 22px -8px rgba(0,0,0,.5); overflow:hidden; }
        .tracks-col { padding:2px 24px 8px; }
        .home-track-row { display:flex; align-items:center; gap:14px; padding:10px 2px; position:relative; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        .home-track-row * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        .home-track-row:active { opacity:0.8; }
        .home-track-row:not(:last-child)::after { content:''; position:absolute; left:58px; right:0; bottom:0; height:1px; background:rgba(255,255,255,0.08); }
        .home-track-meta { flex:1; min-width:0; }
        .home-track-meta .t-title { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-main); }
        .home-track-meta .t-sub { font-size:11.5px; color:var(--text-muted); font-weight:500; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .home-track-row .track-row-delete {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink:0;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            background: var(--accent); color: var(--bg-main); box-shadow: 0 4px 10px rgba(0,0,0,.45);
            opacity: 0; transform: scale(0.4); pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .home-track-row.show-delete .track-row-delete { opacity: 1; transform: scale(1); pointer-events: auto; }
        .home-track-row.show-delete .track-thumb-wrap { animation: qcardShake 0.3s ease; }

        /* ================= HOME: classifiche YouTube Music + top artisti ================= */
        /* Sempre esattamente 3 card fisse (vedi commento su renderChartsSection/
           openChartPlaylist: "le classifiche restano le 3 card fisse in home", mai un
           elenco che cresce) - niente da scorrere, quindi niente scroll orizzontale:
           bastava un tocco anche solo un po' diagonale su quella zona per farla scivolare
           lateralmente e restare storta, dando l'impressione di una riga "mobile" anche
           senza volerlo trascinare davvero.
           PRIMA: card a larghezza fissa (104px) dentro un flex con overflow-x:hidden. Su
           schermi più stretti di ~392px (104*3 + i due gap da 16px + i 48px di padding
           laterale) le 3 card non ci stavano più: la terza restava tagliata a filo del
           bordo destro invece di restringersi, e l'intera riga appariva spostata a
           sinistra anziché centrata. Con un grid a 3 colonne UGUALI le card si
           restringono/allargano insieme per riempire esattamente la larghezza
           disponibile: sempre 3 intere, sempre centrate, su qualunque schermo. */
        .charts-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; padding:10px 24px 8px; touch-action:pan-y; }
        .chart-card { width:100%; min-width:0; display:flex; flex-direction:column; align-items:center; cursor:pointer; -webkit-user-select:none; user-select:none; }
        .chart-card:active .chart-card-thumb { transform:scale(0.96); }
        .chart-card .chart-card-thumb { width:100%; aspect-ratio:1/1; border-radius:50%; background-size:cover; background-position:center; background-color:var(--bg-input); box-shadow:0 10px 22px -8px rgba(0,0,0,.5); }
        .chart-card .chart-card-label { margin-top:9px; width:100%; text-align:center; font-size:12.5px; font-weight:700; line-height:1.25; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .artists-col { padding:2px 24px 8px; }
        .artist-row { display:flex; align-items:center; gap:14px; padding:10px 2px; position:relative; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        .artist-row:active { opacity:0.8; }
        .artist-row:not(:last-child)::after { content:''; position:absolute; left:66px; right:0; bottom:0; height:1px; background:rgba(255,255,255,0.08); }
        .artist-row .artist-rank { width:22px; flex-shrink:0; text-align:center; font-size:16px; font-weight:800; color:var(--text-muted); }
        .artist-row .artist-thumb { width:52px; height:52px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center; background-color:var(--bg-input); }
        .artist-row .artist-meta { flex:1; min-width:0; }
        .artist-row .artist-meta .a-name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-main); }
        .artist-row .artist-meta .a-sub { font-size:12.5px; color:var(--text-muted); font-weight:500; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        #chartsSection, #artistsItSection, #artistsGlobalSection { display:none; }
        #chartsSection.hidden, #artistsItSection.hidden, #artistsGlobalSection.hidden { display:none; }
        #chartsSection:not(.hidden), #artistsItSection:not(.hidden), #artistsGlobalSection:not(.hidden) { display:block; }
        .qcard.latest .circle { box-shadow:0 10px 22px -8px rgba(0,0,0,.5); }
        .qcard.latest .name { color:var(--accent); }
        .qcard .name { font-size:12.5px; font-weight:600; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-main); }
        .qcard .qcard-delete {
            position: absolute; bottom: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
            background: var(--accent); color: var(--bg-main); box-shadow: 0 4px 10px rgba(0,0,0,.45);
            opacity: 0; transform: scale(0.4); pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
        }
        /* Pulsante "pin": stesso ingombro/geometria del cancella, ma in alto a destra
           (dove prima stava il cancella - vedi commento sopra). Icona bianca a riposo;
           quando la card è pinnata (classe .pinned sul .qcard, persistente in
           localStorage/render, non solo durante lo show-delete) l'icona passa al
           colore accento (var(--accent)). Sfondo neutro scuro fisso (non accento) così
           il colore dell'icona resta l'unico segnale di stato, leggibile su qualunque
           artwork sotto. */
        .qcard .qcard-pin {
            position: absolute; top: 4px; right: 6px; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; font-size: 13px;
            color: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
            opacity: 0; transform: scale(0.4) rotate(-25deg); pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s ease;
            z-index: 5;
        }
        .qcard.pinned .qcard-pin { color: var(--accent); }
        /* A differenza del cancella (che resta nascosto finché non tieni premuto), il
           pin di una card già pinnata resta SEMPRE visibile, non solo durante il long
           press: è l'indicatore permanente di stato, non solo un'azione. Il cancella
           continua a comparire solo in .show-delete. */
        .qcard.pinned .qcard-pin { opacity: 1; transform: scale(1) rotate(-25deg); pointer-events: auto; }
        /* Contorno sottile sul solo glifo (stesso trucco -webkit-text-stroke già usato
           per il logo/mag-btn qui sopra), non un bordo sul pulsante: serve solo a dare
           un po' di peso/leggibilità all'icona ora che non ha più il cerchio dietro.
           Bianco di base, nero su Immersive (dove lo sfondo/artwork tende a schiarire
           e il bianco si perderebbe). */
        .qcard-pin i { -webkit-text-stroke: 0.5px #fff; text-stroke: 0.5px #fff; }
        html.immersive .qcard-pin i { -webkit-text-stroke: 0.5px #000; text-stroke: 0.5px #000; }
        .qcard.show-delete .qcard-delete { opacity: 1; transform: scale(1); pointer-events: auto; }
        .qcard.show-delete .qcard-pin { opacity: 1; transform: scale(1) rotate(-25deg); pointer-events: auto; }
        .qcard.show-delete .circle { animation: qcardShake 0.3s ease; }
        @keyframes qcardShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        /* Cornici rimosse su richiesta (nessun bordo su nessuna artwork di canzoni/
           playlist, in nessuna pagina): resta solo lo sfondo neutro sotto la thumbnail
           mentre carica, e - dove già presente - l'ombra (non un bordo colorato). */
        .track-thumb-wrap {
            background-color: rgba(139, 135, 148, 0.16);
        }

        .empty-home { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 30px 0; gap:12px; }
        .empty-home i { font-size:26px; color:var(--text-muted); opacity:.6; }
        .empty-home p { font-size:13.5px; color:var(--text-muted); margin:0; line-height:1.5; }

        /* ================= RISULTATI: righe con divisore (niente più pillole piene) ================= */
        .track-row { position:relative; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
        .track-row * { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-user-drag:none; user-drag:none; }
        .track-row img { touch-action:manipulation; }
        .track-row .text-sm { font-size:13.5px; }
        .track-row .text-xs { font-size:11.5px; }
        .track-row::after { content:''; position:absolute; left:58px; right:0; bottom:0; height:1px; background:rgba(243,239,230,0.08); }
        /* Card artista in cima ai risultati (prependArtistCard): esclusa dal
           rimpicciolimento riservato alle righe canzone, mantiene le dimensioni
           originali (cerchio 64px già invariato) e il divisore alla sua vecchia
           posizione, coerente col cerchio più grande. */
        .track-row-artist .text-sm { font-size:15px; }
        .track-row-artist .text-xs { font-size:12.5px; }
        .track-row-artist::after { left:76px; }
        .track-row:last-child::after { display:none; }

        /* ================= SKIN "IMMERSIVE" (unica skin dell'app, sempre attiva) =================
           Base quasi-nera e accento bianco per home/lista/impostazioni (canvas neutro che
           non entra in conflitto con nessuna copertina), mentre Now Playing sheet, schermata
           lyrics e mini player prendono ognuno un colore DINAMICO calcolato dall'artwork del
           brano in riproduzione (vedi updateImmersiveColorFromArtwork in JS, che scrive il
           risultato in --immersive-color). La modalità vinile è disattivata: l'artwork grande
           non ruota più in un cerchio, diventa invece lo sfondo stesso della schermata. */
        /* Base = colore PIÙ SCURO dell'artwork in ascolto (--immersive-color, calcolato in
           updateImmersiveColorFromArtwork), non più un nero fisso: home, lista canzoni,
           impostazioni e ogni altra schermata seguono così la tonalità del brano corrente,
           esattamente come Now Playing sheet/lyrics/mini player. Referenziando la var invece
           di un valore statico, il fallback (finché nessun brano è stato ancora ascoltato)
           resta comunque quello di sempre - vedi --immersive-color in :root più sopra - e
           passando a un'altra skin questi due valori tornano da soli a quelli statici di
           Moderna/Walkman (la regola sotto smette semplicemente di applicarsi), senza dover
           "ripulire" nulla via JS. */
        html.immersive {
            --bg-main: var(--immersive-color);
            --bg-gradient-top: var(--immersive-color);
            --bg-card: #131316;
            --bg-input: #17171B;
            --accent: #FFFFFF;
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
        }
        /* Cornici delle artwork: colore "accento" (--immersive-accent, variante più
           luminosa/satura dello stesso colore dominante, calcolata insieme a
           --immersive-color - vedi updateImmersiveColorFromArtwork), non più un bianco
           fisso: così anche le cornici seguono la tonalità del brano in ascolto. Le card
           playlist recenti in home (.qcard .circle) NON sono più incluse qui: uniformate
           invece al grigio-lavanda di base via la regola ".qcard .circle" più sopra,
           restano quindi neutre indipendentemente dal brano - solo la card "più recente"
           evidenziata (.qcard.latest, vedi sotto) segue ancora l'accento dinamico. */
        /* Cornici rimosse su richiesta anche per la skin Immersive (vedi sopra): il
           colore dinamico --immersive-accent resta usato solo per testo e sfondi, non
           più per bordi/anelli attorno alle artwork. */
        html.immersive .qcard.latest .circle {
            box-shadow: 0 10px 22px -8px rgba(0,0,0,.5);
        }
        html.immersive .qcard.latest .name { color: var(--immersive-accent); }
        /* Stessa eccezione di riga 1205 per il titolo "SBIXIFY": con una copertina in scala
           di grigi l'accento dinamico diventa il "bianco sporco" #E8E8E6 (classe
           .immersive-grey), praticamente indistinguibile dal bianco normale del nome delle
           altre card (.qcard .name, --text-main) - qui sopra il testo bianco/grigio dello
           sfondo dell'app, non su una pillola chiara come il pulsante play/pause, quindi il
           contrasto va rifatto a mano invece di ereditare il colore chiaro pensato per lì.
        /* Titolo "SBIXIFY" in home: le ultime due lettere ("FY", .custom-text-accent) usano
           di default l'accento statico del tema (--accent, arancione fisso). Solo in
           Immersive le facciamo seguire l'accento dinamico calcolato dall'artwork in
           ascolto (--immersive-accent, vedi updateImmersiveColorFromArtwork), così il
           titolo riflette la tonalità corrente come il resto della skin. */
        html.immersive .app-title .custom-text-accent { color: var(--immersive-accent); }
        /* Eccezione: quando l'accento dinamico è il "bianco sporco" delle copertine in
           scala di grigi (--immersive-accent: #E8E8E6, classe .immersive-grey aggiunta in
           updateImmersiveColorFromArtwork), quel colore è troppo vicino al bianco di "SBIXI"
           per distinguere le due lettere "FY" - qui si passa invece a un grigio medio neutro
           coerente col resto della UI, solo per il titolo. */
        html.immersive.immersive-grey .app-title .custom-text-accent { color: #9C99A6; }
        html.immersive.immersive-grey .qcard.latest .name { color: #9C99A6; }
        /* Eccezione a contrasto rimossa: non ci sono più cornici da colorare attorno al
           mini player o alla thumbnail del brano in ascolto (vedi nota sopra). */
        /* ---- Now Playing sheet: artwork come sfondo (niente più disco rotondo in vista) ---- */
        html.immersive #vinylSlide { display: none; }
        html.immersive #nowPlayingSheet { background: var(--immersive-color); }
        #immersiveBg { display: none; }
        html.immersive #immersiveBg {
            display: block;
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        html.immersive #immersiveBgImg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 80%;
            object-fit: cover;
            /* Punch visivo (solo display, non tocca l'estrazione colore che lavora su
               un'Image separata in extractDominantDarkColor): molte thumbnail YouTube
               sono più piatte/lavate della cover ufficiale, questo le avvicina alla
               resa più satura/contrastata di riferimento (nero più pieno in alto,
               blu/colori più ricchi, luci che risaltano di più). */
            filter: contrast(1.2) saturate(1.4) brightness(0.94);
        }

        /* ---- Tipografia Immersive: tutta la skin, non solo titolo/artista/playlist ----
           General Sans (vedi link Fontshare in <head>) al posto di Inter (usato in tutte
           le altre skin) ovunque in questa - header "In Riproduzione", pulsanti, testo
           lyrics, Impostazioni, barra di ricerca, ecc. Le uniche due dichiarazioni
           font-family esplicite nell'app che altrimenti "vincerebbero" per specificità
           sulla semplice ereditarietà da body (quindi vanno sovrascritte a parte): .display
           e #searchInput, entrambe impostate su Inter esplicito altrove nel foglio stile. */
        html.immersive,
        html.immersive .display,
        html.immersive #searchInput {
            font-family: 'General Sans', 'Inter', sans-serif;
        }
        html.immersive #playerTrackTitle { font-weight: 700; letter-spacing: -0.01em; }


        /* Sfumatura SOLO in basso (non più in alto: l'header lì non ha più testo da
           proteggere, tolto nella richiesta precedente). Resta trasparente per la prima
           parte dell'artwork, poi scurisce progressivamente verso il basso usando le
           varianti a opacità crescente del colore dominante (--immersive-color-15/35/
           55/75/90, calcolate in JS in updateImmersiveColorFromArtwork) invece di
           rgba(0,0,0,...): la tonalità del brano resta coerente per tutta la sfumatura.
           Rivela il colore pieno esattamente dove finisce l'immagine (80%), senza
           cuciture. Niente color-mix() (vedi nota già presente prima): solo rgba()/var()
           dirette. */
        html.immersive #immersiveBg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0) 0%,
                rgba(0,0,0,0) 34%,
                var(--immersive-color-15) 44%,
                var(--immersive-color-35) 52%,
                var(--immersive-color-55) 60%,
                var(--immersive-color-75) 68%,
                var(--immersive-color-90) 75%,
                var(--immersive-color) 80%,
                var(--immersive-color) 100%);
        }
        /* Testi aperti: invece di far sparire immagine+gradiente sottostanti (bug di
           rendering su alcune WebView Android: quella transizione di opacità scattava
           in un frame solo invece di dissolversi in 0.38s), un unico layer piatto del
           colore dominante (#immersiveLyricsCover, vedi HTML sopra) si dissolve IN
           SOPRA a tutto, coprendolo. Stessa durata/curva del pannello lyrics/vinile
           (#vinylSlide, #lyricsPanel) così restano sincronizzati come dissolvenza. */
        html.immersive #immersiveLyricsCover {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: var(--immersive-lyrics-bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        }
        html.immersive #nowPlayingSheet.lyrics-open #immersiveLyricsCover {
            opacity: 1;
        }
        /* Testi, minutaggio e pulsanti della Now Playing sheet: sempre bianchi in questa skin. */
        html.immersive #nowPlayingSheet #sheetHeaderEyebrow,
        html.immersive #nowPlayingSheet #sheetHeaderPlaylistName,
        html.immersive #nowPlayingSheet #closeSheetBtn,
        html.immersive #nowPlayingSheet #playerTrackTitle,
        html.immersive #nowPlayingSheet .custom-text-muted {
            color: #fff !important;
        }
        /* ---- Header ridotto: solo il pulsante download (skin Immersive) ----
           Niente più "In Riproduzione"/nome playlist né freccia di chiusura in alto: la
           chiusura resta comunque disponibile via swipe verso il basso su
           #sheetSwipeCloseArea/#sheetHeaderDrag, già presente per tutte le skin. Il nome
           della playlist si sposta sotto l'artista (vedi #immersivePlaylistBtn più sotto). */
        html.immersive #closeSheetBtn,
        html.immersive #sheetHeaderEyebrow,
        html.immersive #sheetHeaderPlaylistName {
            display: none !important;
        }
        html.immersive #sheetHeaderRow { justify-content: flex-end; }
        /* ---- Nome playlist sotto l'artista (skin Immersive) ----
           Nascosto di default in tutte le skin (solo Immersive lo mostra, e solo quando
           il brano viene davvero da una playlist: la classe "visible" arriva da
           updateNowPlayingHeaderLabel in JS, stessa logica già usata per
           #sheetHeaderPlaylistName). */
        #immersivePlaylistBtn { display: none; }
        html.immersive #immersivePlaylistBtn.visible {
            display: inline-block;
            color: rgba(255, 255, 255, 0.75) !important;
        }
        html.immersive #immersivePlaylistBtn.visible:active { color: #fff !important; }
        /* Altezze ricalibrate: con la riga playlist in più sotto l'artista, il blocco
           titolo/artista/playlist ha bisogno di un filo meno margine sotto rispetto alle
           altre skin (altrimenti la terza riga spinge troppo giù i controlli). */
        html.immersive #trackInfoBlock { margin-bottom: 14px; }
        html.immersive #repeatBtn, html.immersive #sleepTimerBtn,
        html.immersive #prevBtn, html.immersive #nextBtn {
            color: rgba(255, 255, 255, 0.72) !important;
        }
        html.immersive #prevBtn:active, html.immersive #nextBtn:active,
        html.immersive #prevBtn:hover, html.immersive #nextBtn:hover {
            color: #fff !important;
        }
        html.immersive #repeatBtn.active #repeatIcon,
        html.immersive #sleepTimerBtn.active #sleepTimerIcon {
            color: var(--immersive-accent) !important;
            -webkit-text-stroke-color: var(--immersive-color);
        }
        html.immersive #progressBar, html.immersive #miniProgressBar { background-color: #fff !important; }
        html.immersive #playPauseBtn { box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
        html.immersive #sheetArtworkGlow, html.immersive #sheetArtworkShadow { display: none; }

        /* ---- Schermata lyrics: colore "accento" come sfondo (stesso usato per mini player
           e cornici, vedi sopra), testo nero o bianco a seconda di quanto risulta chiaro
           quell'accento (--immersive-accent-text, calcolato insieme al colore) - così resta
           leggibile anche su copertine chiare, non solo bianco fisso su sfondo sempre scuro. */
        html.immersive #lyricsPanel {
            background: var(--immersive-lyrics-bg);
            border-radius: 22px;
        }
        html.immersive .lyrics-line {
            /* Non più un grigio fisso uguale su ogni copertina, ma il testo "affondato"
               verso il colore di sfondo della schermata (--immersive-lyrics-muted,
               calcolato insieme agli altri: bianco mescolato con lo sfondo scuro reale del
               brano, non un grigio neutro scollegato) - così la riga non cantata sembra
               più sullo sfondo invece che semplicemente "spenta", e resta coerente con il
               resto della skin che segue sempre la tonalità del brano in ascolto. */
            color: var(--immersive-lyrics-muted);
            opacity: 0.38;
        }
        html.immersive .lyrics-line.active {
            color: var(--immersive-lyrics-text);
            opacity: 1;
        }

        /* ---- Mini player: un solo colore pieno (lo stesso dominante della Now Playing
           sheet), niente immagine di sfondo, UI sempre bianca sopra. NIENTE "position:
           relative" qui: il mini player è "fixed" (classe Tailwind sull'elemento) per stare
           ancorato in fondo allo schermo - sovrascriverlo con "relative" lo faceva
           rientrare nel normale flusso della pagina invece che restare fissato, motivo per
           cui usciva dallo schermo. "fixed" è già di per sé un contesto di posizionamento,
           quindi non serve altro perché backdrop-filter/overflow funzionino. */
        html.immersive #miniPlayer {
            overflow: hidden;
            background: var(--immersive-accent) !important;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        /* Testo e barra di avanzamento del mini player: nero o bianco a seconda di quanto
           risulta chiaro l'accento (--immersive-accent-text) - il suo sfondo non è più
           sempre scuro come prima (era --immersive-color), quindi il testo deve adattarsi
           per restare leggibile anche su copertine chiare. */
        html.immersive #miniPlayerTitle,
        html.immersive #miniPlayerChannel,
        html.immersive #miniProgressBarArea {
            color: var(--immersive-accent-text) !important;
        }
        html.immersive #miniProgressBarContainer > div:first-child {
            background: var(--immersive-accent-text) !important;
            opacity: 0.22;
        }
        html.immersive #miniProgressBar {
            background: var(--immersive-accent-text) !important;
            opacity: 0.85;
        }
        /* Copertine grigie/nere (classe "immersive-grey" su <html>, aggiunta/tolta in
           updateImmersiveColorFromArtwork insieme alle altre variabili): SOLO il pulsante
           play/pause del mini player si inverte, cerchio nero e icona bianca, invece del
           solito cerchio bianco/icona scura (--accent è bianco fisso in questa skin, vedi
           html.immersive più sopra) - su un mini player già quasi bianco il pulsante bianco
           spariva quasi del tutto. Il pulsante grande della Now Playing sheet (#playPauseBtn)
           NON è incluso: lì sotto c'è sempre l'artwork/gradiente scuro, mai il bianco piatto
           del mini player, quindi il contrasto originale va già bene. */
        html.immersive.immersive-grey #miniPlayPauseBtn {
            background-color: var(--immersive-color) !important;
            color: #ffffff !important;
        }

        /* ---- Home "Canzoni" e lista tracce: riga del brano in ascolto evidenziata con
           il colore dinamico dell'artwork (--immersive-accent, stessa logica già usata
           per il mini player, vedi updateImmersiveColorFromArtwork) - come nella
           reference YT Music mostrata dall'utente. La transizione sta sul selettore base
           (non solo su ".playing"), così anima sia quando la classe viene aggiunta/tolta
           al cambio brano, sia quando la CSS var stessa cambia poco dopo (l'estrazione
           colore è async): risultato, un'unica dissolvenza percepita verso il colore
           giusto invece di uno scatto. */
        html.immersive .track-row,
        html.immersive .home-track-row {
            border-radius: 14px;
            transition: background-color 0.45s ease;
        }
        /* La pillola colorata del brano in ascolto (sfondo --immersive-accent) resta
           riservata alla lista canzoni (.track-row, risultati/playlist): in home
           (.home-track-row) non c'è più alcuna evidenziazione, la riga del brano corrente
           resta identica alle altre come richiesto. */
        html.immersive .track-row.playing {
            background: var(--immersive-accent);
            /* Pillola un po' più bassa e più larga ai lati rispetto alla riga normale:
               il padding orizzontale extra è compensato da un margine negativo della stessa
               entità (differenza rispetto al padding di base della riga, 0 su .track-row),
               così il contenuto (thumbnail, testo) resta allineato a dov'era prima e solo
               lo sfondo colorato si allarga oltre i bordi consueti della riga, "mangiando"
               un po' del padding del contenitore attorno. */
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 12px;
            padding-right: 12px;
            margin-left: -12px;
            margin-right: -12px;
        }
        html.immersive .track-row.playing::after {
            display: none;
        }
        /* Il testo passa a nero o bianco (--immersive-accent-text, calcolato insieme al
           colore) a seconda di quanto risulta chiara la tonalità dominante, per restare
           leggibile anche su copertine chiare come nella reference. */
        html.immersive .track-row.playing p.text-sm,
        html.immersive .track-row.playing p.text-xs {
            color: var(--immersive-accent-text) !important;
            transition: color 0.45s ease;
        }

        /* ================= Riga label/sottotitolo (stile riusabile per righe impostazioni) ================= */
        .theme-select-row .lbl { font-size:13px; font-weight:600; color:var(--text-main); }
        .theme-select-row .sub { font-size:11px; color:var(--text-muted); margin-top:2px; margin-bottom:10px; }

        /* Rete di sicurezza: forza il clip circolare anche sulla cornice, indipendente da
           border-radius+overflow-hidden (che su alcuni WebView Android può avere problemi
           a "seguire" un figlio con transform, lasciando sfuggire gli angoli dell'immagine
           oltre il bordo tondo). clip-path da solo si è rivelato insufficiente sullo
           stesso WebView: aggiunta una maschera radiale (mask-image), tecnica diversa
           e più affidabile per questo tipo di bug di clipping. */
        #sheetArtworkFrame {
            clip-path: circle(50% at 50% 50%);
            -webkit-mask-image: radial-gradient(circle closest-side, #fff 99%, transparent 100%);
            mask-image: radial-gradient(circle closest-side, #fff 99%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* ================= Testi sincronizzati (swipe orizzontale sulla fascia artwork) =================
           Sostituisce SOLO la fascia dell'artwork (da sotto l'header a sopra
           titolo/controlli), non l'intera sheet. Swipe verso sinistra: l'artwork scorre
           via a sinistra e sparisce, il testo entra al suo posto da destra. Swipe verso
           destra sul testo: animazione inversa. La riga "cantata ora" è evidenziata con
           --accent (si adatta automaticamente al tema attivo), le altre restano
           attenuate; lo scroll automatico la mantiene centrata.
           NB: niente overflow:hidden qui sopra (band NON lo ha) - il ritaglio necessario
           a nascondere artwork/testo quando sono fuori vista arriva già dal contenitore
           #nowPlayingSheet (schermo intero, overflow:hidden). Prima invece il ritaglio
           extra su questa fascia (più stretta del foglio) tagliava in modo asimmetrico
           anche l'alone sfocato dell'artwork (#sheetArtworkGlow), creando lo strano
           "alone quadrato" visibile pure da ferma: rimosso qui, il glow resta libero di
           sfumare senza bordi netti. */
        #artworkBand {
            position: relative;
            touch-action: pan-y;
            overscroll-behavior: none;
        }
        #vinylSlide {
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
        }
        #artworkBand.dragging #vinylSlide,
        #artworkBand.dragging #lyricsPanel {
            transition: none;
        }
        #artworkBand.lyrics-shown #vinylSlide {
            transform: translate3d(-115%, 0, 0);
            opacity: 0;
            pointer-events: none;
        }
        #lyricsPanel {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            transform: translate3d(115%, 0, 0);
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        #artworkBand.lyrics-shown #lyricsPanel {
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }
        #lyricsScroll {
            flex: 1;
            overflow-y: auto;
            /* CRITICO: senza questo, quando la riga "cantata ora" si ingrandisce con
               transform: scale() qui sotto e sborda anche solo di 1px oltre il bordo
               orizzontale del contenitore, il browser forza automaticamente anche
               overflow-x a 'auto' (regola CSS: se un asse ha overflow non-visible e
               l'altro è visible, quello visible diventa auto). #lyricsScroll diventa
               quindi scrollabile in orizzontale a runtime, esattamente sull'asse dello
               swipe custom gestito a mano su #artworkBand: i due sistemi si accavallano
               e il pannello texts scivola/esce dallo schermo appena compare una riga
               attiva. overflow-x: hidden blocca la conversione automatica e mantiene
               questo contenitore scrollabile SOLO in verticale, sempre. */
            overflow-x: hidden;
            padding: 4px 6px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
        }
        #lyricsScroll::-webkit-scrollbar { display: none; }
        .lyrics-line {
            font-size: 20px;
            line-height: 1.45;
            font-weight: 800;
            color: var(--text-muted);
            opacity: 0.45;
            /* Sfocatura sulle righe non attive (stile "a fuoco solo il presente" di
               Apple Music/Spotify): la riga cantata ora risalta nitida, il resto sfuma
               visivamente oltre che nell'opacità. */
            filter: blur(2.5px);
            /* Padding laterale: lascia margine per l'ingrandimento della riga attiva
               (transform: scale) qui sotto, altrimenti le righe già larghe quasi
               quanto il contenitore vengono tagliate ai bordi quando si ingrandiscono
               (lo scale non fa ricalcolare il wrapping, allarga solo visivamente). */
            padding: 6px 14px;
            text-align: center;
            overflow-wrap: break-word;
            word-break: break-word;
            transition: color 0.25s ease, opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
        }
        .lyrics-line.active {
            color: var(--accent);
            opacity: 1;
            filter: blur(0);
            transform: scale(1.08);
        }
        /* Nota: la sfocatura/opacità delle righe non attive è ora graduale in base
           alla distanza dalla riga attiva, calcolata ed impostata inline da
           updateActiveLyricLine() in JS - non più un valore fisso qui in CSS. */
        .lyrics-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Spostata leggermente sotto la sfumatura superiore di #lyricsScroll (24px)
               invece che centrata sull'intera altezza: da centrata risultava troppo
               vicina alla sfumatura quando il messaggio è corto. Non esagerare con
               questo valore: più sotto si rischia di avvicinarsi troppo al blocco
               titolo/progress sotto #artworkBand. */
            padding-top: 28px;
            gap: 10px;
            color: var(--text-muted);
            text-align: center;
            padding-left: 30px;
            padding-right: 30px;
            font-size: 13px;
        }
        .lyrics-state i { font-size: 22px; opacity: 0.6; }

        /* ================= Modalità Auto (testo a schermo intero, orizzontale) =================
           Pulsante gemello di #lyricsOffsetBtn ma a destra, stessa striscia in alto,
           sovrapposto al pulsante download (stessa posizione assoluta, dissolvenza
           incrociata - vedi CSS più sotto), visibile SOLO quando i testi sono aperti
           (.lyrics-open). Apre #driveMode: un
           overlay a schermo intero, sempre nero, che ospita (spostandolo davvero nel DOM,
           non duplicandolo - vedi openDriveMode/closeDriveMode in JS) lo stesso identico
           #lyricsScroll già usato nel pannello testi normale. Così riga attiva, scroll
           automatico e offset di sincronizzazione restano l'UNICA fonte di verità, senza
           bisogno di tenere due copie sincronizzate a mano.
           Il device NON viene fisicamente ruotato (il manifest blocca l'orientamento a
           "portrait" e affidarsi alla Screen Orientation API sarebbe inaffidabile su
           installed PWA/car mount): il contenuto viene invece ruotato via CSS
           (transform: rotate(90deg) su un riquadro 100vh x 100vw), il classico trucco per
           ottenere una resa orizzontale a prescindere da come il telefono è fisicamente
           montato in auto. */
        /* Pulsante "Modalità auto" e pulsante download: stessa identica posizione
           assoluta (stessi top/right/z-index/padding), letteralmente sovrapposti uno
           sull'altro. Non serve nessun volo/morph tra due posizioni diverse: i due
           pulsanti non si incontrano mai (download quando i testi sono chiusi, auto
           quando sono aperti), quindi basta una dissolvenza incrociata via opacity,
           pilotata dalla classe .lyrics-open su #nowPlayingSheet (vedi
           openLyricsPanel/closeLyricsPanel in JS, che si limitano ad aggiungere/togliere
           quella classe). */
        #driveModeBtn,
        #sheetDownloadBtn {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 30px);
            right: 24px;
            z-index: 30;
            padding: 8px;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }
        /* A riposo (testi chiusi): auto invisibile e non cliccabile, download visibile
           con la sua opacità/stato normale (enable/disable per brano, invariato). */
        #driveModeBtn {
            opacity: 0;
            pointer-events: none;
        }
        html.immersive #driveModeBtn { color: #fff !important; }
        /* Pulsante download in Immersive: icona bianca che su artwork chiare/vivaci
           tende a confondersi con lo sfondo - un filo di contorno nero (0.8px) la
           mantiene leggibile senza cambiarne il colore. -webkit-text-stroke disegna
           il contorno attorno al glifo dell'icona (Font Awesome è un font, non un
           path SVG), quindi va applicato all'elemento <i> che contiene il glifo. */
        html.immersive #sheetDownloadBtn i {
            -webkit-text-stroke: 0.8px #000;
            text-stroke: 0.8px #000;
        }
        #nowPlayingSheet.lyrics-open #driveModeBtn {
            opacity: 1;
            pointer-events: auto;
        }
        #nowPlayingSheet.lyrics-open #driveModeBtn:active { opacity: 0.7; }
        /* Testi aperti: il download reale si dissolve invece di volare via - !important
           perché deve vincere sia sull'opacità Tailwind di stato disabilitato (opacity-30)
           sia su quella abilitata. */
        #nowPlayingSheet.lyrics-open #sheetDownloadBtn {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #driveMode {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            overflow: hidden;
        }
        #driveMode.active { display: block; }
        /* Riquadro ruotato: dimensionato con altezza/larghezza dello schermo scambiate
           (100vh di larghezza, 100vw di altezza) e poi ruotato di 90°, così dopo la
           rotazione riempie esattamente lo schermo reale in orizzontale. */
        #driveModeRotate {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            box-sizing: border-box;
        }
        /* Testo molto più grande di quello del pannello normale (qui si legge al volo,
           da lontano, mentre si guida) - stessa classe .lyrics-line/.lyrics-line.active
           di sempre, quindi eredita automaticamente i colori giusti per ogni skin
           (compreso l'override Walkman qui sopra) senza bisogno di nuove regole colore. */
        #driveModeRotate .lyrics-line {
            font-size: 30px;
            padding: 10px 26px;
        }
        /* Immersive: nel pannello testi normale la riga attiva è bianco fisso
           (--immersive-lyrics-text), pensato per lo sfondo scuro-ma-non-nero di quella
           schermata (--immersive-lyrics-bg). In Modalità Auto lo sfondo è SEMPRE nero
           puro, quindi qui il bianco fisso perde senso: la riga cantata ora usa invece
           l'accento dinamico dell'artwork (--immersive-accent, la stessa tonalità già
           usata da mini player/cornici/pillola in ascolto), coerente con "i colori soliti
           di ogni skin" invece di un bianco slegato dal brano. Le righe non attive
           restano invariate (--immersive-lyrics-muted, ancora leggibile su nero). */
        html.immersive #driveModeRotate .lyrics-line.active {
            color: var(--immersive-accent);
        }
        #driveModeRotate .lyrics-state { font-size: 15px; }
        #driveModeRotate .lyrics-state i { font-size: 26px; }
    </style>
</head>
<body class="flex flex-col justify-between hidden py-4 box-border h-full app-body-bg relative">
    <!-- Campi "esca" invisibili e non raggiungibili: servono solo a far sì che Chrome/Android
         associno la classificazione "username/password" a QUESTI campi finti invece che ai
         veri campi API Key più sotto nella pagina, che altrimenti vengono scambiati per una
         coppia di credenziali (facendo comparire la barra suggerimenti password/carta/indirizzo
         anche quando si tocca tutt'altro campo, es. la ricerca). Non hanno alcun effetto
         funzionale: non vengono mai letti né inviati da nessuno script. -->
    <div aria-hidden="true" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; left:-9999px;">
        <input type="text" name="username" autocomplete="username" tabindex="-1">
        <input type="password" name="password" autocomplete="new-password" tabindex="-1">
    </div>

    <!-- Vedi commento CSS su #gestureEdgeGuard: riserva il bordo inferiore al gesto
         di sistema Android (reveal nav bar), invece che allo scroll delle liste. -->
    <div id="gestureEdgeGuard" aria-hidden="true"></div>

    <!-- Sezione Principale -->
    <main class="flex-1 flex flex-col overflow-hidden z-10 relative app-gradient-bg">
        <section class="flex-1 flex flex-col overflow-hidden h-full relative">
            <div id="viewsSlider" class="flex h-full">
                <!-- VISTA 1: Home (Recenti) -->
                <div id="homeView" class="shrink-0 h-full overflow-y-auto pr-0 pb-28">
                    <!-- HEADER HOME: menu impostazioni + titolo + pillola di ricerca.
                         Ora è il PRIMO figlio della vista home stessa (sticky in cima),
                         invece di stare fuori/sopra come blocco a parte con altezza
                         sincronizzata via JS: così scorre insieme al resto della vista
                         durante lo swipe/slide, che resta sempre e solo orizzontale, e
                         mantiene sempre la sua altezza naturale (niente più vuoti). -->
                    <div class="home-header" id="homeHeader">
                        <div class="home-header-row">
                            <button id="apiConfigBtn" class="menu-icon-btn" title="Impostazioni">
                                <span class="menu-bars"><span></span><span></span></span>
                            </button>
                            <h1 class="app-title display"><span class="custom-text-accent">Sbixi</span>Local</h1>
                        </div>

                        <div class="quick-eyebrow" style="display:flex;align-items:center;justify-content:space-between;">
                            <span>Playlist</span>
                            <button id="addFolderBtn" class="menu-icon-btn" title="Aggiungi cartella" style="width:32px;height:32px;">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div id="recentGrid" class="quick-grid hidden"></div>
                        <div id="recentTracksSection" class="hidden">
                            <div class="quick-eyebrow">Canzoni recenti</div>
                            <div id="recentTracksCol" class="tracks-col"></div>
                        </div>

                        <div id="emptyHome" class="empty-home">
                            <i class="fa-solid fa-folder-open"></i>
                            <p>Tocca "+" per aggiungere una cartella di musica dal telefono.<br>Le tue playlist e i brani ascoltati appariranno qui.</p>
                        </div>
                    </div>
                </div>
                <!-- VISTA 2: Lista Canzoni (risultati ricerca / playlist aperta) -->
                <div id="resultsView" class="shrink-0 h-full overflow-y-auto pr-0">
                    <!-- HEADER RISULTATI: freccia indietro + nome ricerca/playlist.
                         Stesso discorso dell'header home: primo figlio della vista
                         risultati stessa (sticky in cima), altezza sempre naturale
                         e compatta, nessuna sincronizzazione JS necessaria. -->
                    <div class="results-header" id="resultsHeader">
                        <button id="backToHomeBtn" class="back-btn" title="Torna alla home">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <span class="rt display" id="resultsTitle">Risultati</span>
                        <button id="refreshPlaylistBtn" class="hidden refresh-btn" title="Aggiorna playlist (ricarica da Spotify, salta la cache)">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
