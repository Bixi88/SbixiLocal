name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze npm
        run: npm install

      - name: Prepara cartella www/
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/ 2>/dev/null || true

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Sostituisci l'icona dell'app con la tua icona
        run: |
          set -e
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size=${sizes[$density]}
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert icon-512.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert icon-512.png -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done

      - name: Ripristina chiave di firma stabile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nessun segreto ANDROID_KEYSTORE_BASE64 trovato: verrà usata la chiave di debug temporanea (richiederà disinstallazione tra un aggiornamento e l'altro)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/lifa-release.keystore
            python3 - << 'PYEOF'
import re
path = "android/app/build.gradle"
with open(path) as f:
    content = f.read()

signing_block = '''
    signingConfigs {
        debug {
            storeFile file("../lifa-release.keystore")
            storePassword "LifaFamiglia2026!"
            keyAlias "lifa"
            keyPassword "LifaFamiglia2026!"
        }
    }
'''

if "signingConfigs {" not in content:
    content = content.replace("android {", "android {" + signing_block, 1)

if re.search(r'debug\s*\{[^}]*signingConfig signingConfigs\.debug', content) is None:
    content = re.sub(
        r'(buildTypes\s*\{)',
        r'\1\n        debug {\n            signingConfig signingConfigs.debug\n        }',
        content, count=1
    )

with open(path, "w") as f:
    f.write(content)
print("build.gradle aggiornato con la firma stabile.")
PYEOF
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rinomina APK in LiFa.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LiFa.apk

      - name: Pubblica APK come release "latest"
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: LiFa (ultima build)
          allowUpdates: true
          removeArtifacts: true
          artifacts: LiFa.apk
          body: "APK generato automaticamente dall'ultimo push su main."
