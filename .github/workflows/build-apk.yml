name: Build SbixiLocal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        run: npm install && npm install -D typescript

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SBIXILOCAL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/sbixilocal-release.jks

      - name: Build signed release APK
        env:
          SBIXILOCAL_KEYSTORE_PATH: ${{ runner.temp }}/sbixilocal-release.jks
          SBIXILOCAL_KEYSTORE_PASSWORD: ${{ secrets.SBIXILOCAL_KEYSTORE_PASSWORD }}
          SBIXILOCAL_KEY_ALIAS: ${{ secrets.SBIXILOCAL_KEY_ALIAS }}
          SBIXILOCAL_KEY_PASSWORD: ${{ secrets.SBIXILOCAL_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK with version + commit info
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             out/SbixiLocal-${{ github.run_number }}-${{ github.sha }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk \
             out/SbixiLocal-latest.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SbixiLocal-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SbixiLocal build ${{ github.run_number }}
          files: out/SbixiLocal-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
